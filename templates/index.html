<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Edge Vision" />
  <title>Edge Vision — CV Monitor</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="apple-touch-icon" href="/static/icon-192.png" />

  <style>
    /* ── Google Font ─────────────────────────────────────────── */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    /* ── Design Tokens ───────────────────────────────────────── */
    :root {
      --bg:           #0a0e1a;
      --surface:      #111827;
      --surface2:     #1a2235;
      --border:       #1e2d45;
      --accent:       #3b82f6;
      --accent-glow:  rgba(59,130,246,0.25);
      --green:        #22c55e;
      --green-dim:    rgba(34,197,94,0.15);
      --amber:        #f59e0b;
      --red:          #ef4444;
      --text:         #f1f5f9;
      --text-muted:   #64748b;
      --text-dim:     #94a3b8;
      --radius:       14px;
      --radius-sm:    8px;
      --transition:   0.2s ease;
    }

    /* ── Reset ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Root layout ─────────────────────────────────────────── */
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ── Status Bar ───────────────────────────────────────────── */
    #status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      padding-top: max(10px, env(safe-area-inset-top));
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
      transition: background var(--transition), box-shadow var(--transition);
    }
    #status-dot.connected   { background: var(--green); box-shadow: 0 0 8px var(--green); }
    #status-dot.connecting  { background: var(--amber); animation: pulse 1s infinite; }
    #status-dot.error       { background: var(--red); }

    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: 0.3; }
    }

    #status-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      flex: 1;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    #app-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Screens ─────────────────────────────────────────────── */
    .screen {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .screen.active { display: flex; }

    /* ── Home Screen ─────────────────────────────────────────── */
    #screen-home {
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 24px 20px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }

    .home-logo {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
      box-shadow: 0 0 40px var(--accent-glow);
    }

    .home-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #f1f5f9, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .home-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 48px;
      text-align: center;
      line-height: 1.5;
    }

    .mode-cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 360px;
    }

    .mode-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--transition);
      text-align: left;
      -webkit-user-select: none;
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .mode-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .mode-btn.capture::before { background: linear-gradient(135deg, rgba(59,130,246,0.08), transparent); }
    .mode-btn.monitor::before { background: linear-gradient(135deg, rgba(34,197,94,0.08), transparent); }

    .mode-btn:active { transform: scale(0.97); }
    .mode-btn:active::before { opacity: 1; }

    .mode-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .capture .mode-icon { background: rgba(59,130,246,0.15); }
    .monitor .mode-icon { background: rgba(34,197,94,0.15); }

    .mode-text h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
    }

    .mode-text p {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .mode-arrow {
      margin-left: auto;
      color: var(--text-muted);
      font-size: 18px;
    }

    /* ── Capture Screen ───────────────────────────────────────── */
    #screen-capture {
      position: relative;
      background: #000;
    }

    #video-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Overlay HUD — sits on top of camera preview */
    #capture-hud {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }

    #capture-top {
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      pointer-events: all;
    }

    #capture-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(239,68,68,0.9);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 5px 10px;
      border-radius: 20px;
    }

    #capture-badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 1s infinite;
    }

    #frame-counter {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      font-weight: 500;
    }

    #capture-bottom {
      margin-top: auto;
      padding: 20px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
      pointer-events: all;
    }

    #btn-stop-capture {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(239,68,68,0.9);
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    /* ── Monitor Screen ───────────────────────────────────────── */
    #screen-monitor {
      overflow: hidden;
    }

    #monitor-header {
      padding: 14px 16px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #monitor-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    #last-update {
      font-size: 11px;
      color: var(--text-muted);
    }

    #btn-stop-monitor {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }

    /* Summary cards row */
    #summary-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 12px 12px 0;
    }

    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 10px;
      text-align: center;
    }

    .summary-card .val {
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }

    .summary-card .lbl {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .val.blue   { color: var(--accent); }
    .val.green  { color: var(--green); }
    .val.amber  { color: var(--amber); }

    /* Stability bar */
    #stability-wrap {
      padding: 10px 12px 0;
    }

    #stability-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    #stability-track {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    #stability-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), var(--green));
      transition: width 0.5s ease;
      width: 0%;
    }

    /* Object cards list */
    #objects-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      -webkit-overflow-scrolling: touch;
    }

    #objects-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .obj-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      animation: slide-in 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .obj-card.is-new::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--amber);
      border-radius: 3px 0 0 3px;
    }

    .obj-card-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .obj-emoji {
      font-size: 24px;
      flex-shrink: 0;
    }

    .obj-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .obj-new-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--amber);
      background: rgba(245,158,11,0.15);
      border-radius: 4px;
      padding: 2px 6px;
      margin-left: 4px;
    }

    .obj-category {
      font-size: 11px;
      color: var(--text-muted);
    }

    .obj-track {
      margin-left: auto;
      font-size: 10px;
      color: var(--text-muted);
      background: var(--surface2);
      border-radius: 4px;
      padding: 2px 6px;
    }

    .obj-meta {
      display: flex;
      gap: 12px;
    }

    .obj-stat {
      flex: 1;
    }

    .obj-stat-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .conf-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .conf-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), #6366f1);
    }

    .conf-val {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      margin-top: 3px;
    }

    .dur-val {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
    }

    /* Empty / waiting state */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    #empty-state .icon { font-size: 40px; }
    #empty-state p { font-size: 13px; text-align: center; line-height: 1.6; }

    /* Spinner */
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Hidden canvas for frame capture */
    #capture-canvas { display: none; }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Status Bar (always visible) ────────────────────────── -->
  <div id="status-bar">
    <div id="status-dot"></div>
    <span id="status-text">Not connected</span>
    <span id="app-label">Edge Vision</span>
  </div>

  <!-- ── Screen: Home ────────────────────────────────────────── -->
  <div id="screen-home" class="screen active">
    <div class="home-logo">👁</div>
    <h1 class="home-title">Edge Vision</h1>
    <p class="home-sub">Real-time computer vision<br>at the edge of your network</p>

    <div class="mode-cards">
      <button class="mode-btn capture" onclick="App.enterCapture()">
        <div class="mode-icon">📷</div>
        <div class="mode-text">
          <h3>Capture</h3>
          <p>Stream your camera to the CV server</p>
        </div>
        <span class="mode-arrow">›</span>
      </button>

      <button class="mode-btn monitor" onclick="App.enterMonitor()">
        <div class="mode-icon">📊</div>
        <div class="mode-text">
          <h3>Monitor</h3>
          <p>View live detection results</p>
        </div>
        <span class="mode-arrow">›</span>
      </button>
    </div>
  </div>

  <!-- ── Screen: Capture ─────────────────────────────────────── -->
  <div id="screen-capture" class="screen">
    <video id="video-preview" autoplay playsinline muted></video>
    <canvas id="capture-canvas"></canvas>

    <div id="capture-hud">
      <div id="capture-top">
        <div id="capture-badge">
          <div id="capture-badge-dot"></div>
          LIVE
        </div>
        <span id="frame-counter">0 frames sent</span>
      </div>
      <div id="capture-bottom">
        <button id="btn-stop-capture" onclick="App.exitToHome()">
          ⬛ Stop Streaming
        </button>
      </div>
    </div>
  </div>

  <!-- ── Screen: Monitor ─────────────────────────────────────── -->
  <div id="screen-monitor" class="screen">

    <div id="monitor-header">
      <div>
        <div id="monitor-title">Live Detection Feed</div>
        <div id="last-update">Waiting for data…</div>
      </div>
      <button id="btn-stop-monitor" onclick="App.exitToHome()">✕ Exit</button>
    </div>

    <div id="summary-row">
      <div class="summary-card">
        <div class="val blue" id="stat-total">0</div>
        <div class="lbl">Detected</div>
      </div>
      <div class="summary-card">
        <div class="val green" id="stat-new">0</div>
        <div class="lbl">New</div>
      </div>
      <div class="summary-card">
        <div class="val amber" id="stat-removed">0</div>
        <div class="lbl">Removed</div>
      </div>
    </div>

    <div id="stability-wrap">
      <div id="stability-label">
        <span>Scene Stability</span>
        <span id="stability-pct">0%</span>
      </div>
      <div id="stability-track">
        <div id="stability-fill"></div>
      </div>
    </div>

    <div id="objects-scroll">
      <div id="objects-list">
        <div id="empty-state">
          <span class="icon">🔍</span>
          <p>Connecting to server…<br>Make sure a Capture device is streaming.</p>
          <div class="spinner"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
/**
 * Edge Vision — Mobile PWA Controller
 *
 * Security: This client ONLY sends frames to /ws/capture and ONLY receives
 * detection JSON from /ws/monitor. No server internals (FPS, CPU, RAM, model
 * names, paths) are ever requested or displayed.
 */

const CAPTURE_FPS   = 10;        // Frames per second sent to server
const JPEG_QUALITY  = 0.70;      // JPEG compression quality (0–1)
const RECONNECT_MS  = 3000;      // ms before reconnecting monitor WS
const FRAME_W       = 640;       // Max width before resize (saves bandwidth)

// ── Category → emoji map (purely cosmetic, no server data) ────────────────
const CATEGORY_EMOJI = {
  'Humans':      '🧍',
  'Vehicles':    '🚗',
  'Animals':     '🐕',
  'Electronics': '💻',
  'Furniture':   '🪑',
  'Kitchen':     '🍽',
  'Sports':      '⚽',
  'Outdoor':     '🌳',
  'Accessories': '👜',
  'Other':       '📦',
};

// ── Detect server origin automatically ─────────────────────────────────────
const WS_BASE = (() => {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${proto}//${location.host}`;
})();

// ── Status bar helper ──────────────────────────────────────────────────────
const StatusBar = {
  dot:  document.getElementById('status-dot'),
  text: document.getElementById('status-text'),
  set(state, msg) {
    this.dot.className = state;
    this.text.textContent = msg;
  }
};

// ── Screen router ──────────────────────────────────────────────────────────
const Screens = {
  show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + id).classList.add('active');
  }
};

// ── Capture Mode ────────────────────────────────────────────────────────────
const Capture = {
  ws:         null,
  stream:     null,
  canvas:     null,
  ctx:        null,
  video:      null,
  timer:      null,
  frameCount: 0,

  async start() {
    this.video   = document.getElementById('video-preview');
    this.canvas  = document.getElementById('capture-canvas');
    this.ctx     = this.canvas.getContext('2d');
    this.frameCount = 0;

    // Request rear camera on mobile (environment), fallback to any camera
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width:  { ideal: 1280 },
          height: { ideal: 720 },
        },
        audio: false,
      });
    } catch (e) {
      alert('Camera permission denied: ' + e.message);
      App.exitToHome();
      return;
    }

    this.video.srcObject = this.stream;
    await this.video.play();

    // Connect WebSocket
    StatusBar.set('connecting', 'Connecting to server…');
    this._connectWS();
  },

  _connectWS() {
    if (this.ws) { try { this.ws.close(); } catch(_){} }

    this.ws = new WebSocket(WS_BASE + '/ws/capture');
    this.ws.binaryType = 'arraybuffer';

    this.ws.onopen = () => {
      StatusBar.set('connected', 'Streaming to server');
      this._startLoop();
    };

    this.ws.onerror = () => {
      StatusBar.set('error', 'Connection error — retrying…');
    };

    this.ws.onclose = () => {
      clearInterval(this.timer);
      if (Capture.stream) {
        StatusBar.set('connecting', 'Reconnecting…');
        setTimeout(() => { if (Capture.stream) Capture._connectWS(); }, RECONNECT_MS);
      }
    };
  },

  _startLoop() {
    clearInterval(this.timer);
    const interval = Math.round(1000 / CAPTURE_FPS);
    this.timer = setInterval(() => this._sendFrame(), interval);
  },

  _sendFrame() {
    if (!this.ws || this.ws.readyState !== WebSocket.OPEN) return;
    if (this.video.readyState < 2) return;   // Video not ready yet

    // Resize frame to save bandwidth
    const vw = this.video.videoWidth;
    const vh = this.video.videoHeight;
    const scale = Math.min(1, FRAME_W / vw);
    const w = Math.round(vw * scale);
    const h = Math.round(vh * scale);

    this.canvas.width  = w;
    this.canvas.height = h;
    this.ctx.drawImage(this.video, 0, 0, w, h);

    this.canvas.toBlob(blob => {
      if (!blob || !this.ws || this.ws.readyState !== WebSocket.OPEN) return;
      blob.arrayBuffer().then(buf => {
        this.ws.send(buf);
        this.frameCount++;
        document.getElementById('frame-counter').textContent =
          this.frameCount + ' frame' + (this.frameCount === 1 ? '' : 's') + ' sent';
      });
    }, 'image/jpeg', JPEG_QUALITY);
  },

  stop() {
    clearInterval(this.timer);
    this.timer = null;
    if (this.ws) { try { this.ws.close(); } catch(_){} this.ws = null; }
    if (this.stream) {
      this.stream.getTracks().forEach(t => t.stop());
      this.stream = null;
    }
    this.video.srcObject = null;
  }
};

// ── Monitor Mode ────────────────────────────────────────────────────────────
const Monitor = {
  ws:         null,
  retryTimer: null,
  retrying:   false,

  start() {
    this._connect();
  },

  _connect() {
    if (this.ws) { try { this.ws.close(); } catch(_){} }
    StatusBar.set('connecting', 'Connecting to monitor feed…');

    this.ws = new WebSocket(WS_BASE + '/ws/monitor');

    this.ws.onopen = () => {
      StatusBar.set('connected', 'Monitor feed live');
      this.retrying = false;
    };

    this.ws.onmessage = (evt) => {
      try {
        const data = JSON.parse(evt.data);
        this._render(data);
      } catch(e) {
        console.warn('Monitor: could not parse JSON:', e);
      }
    };

    this.ws.onerror = () => {
      StatusBar.set('error', 'Feed error — retrying…');
    };

    this.ws.onclose = () => {
      if (Monitor.ws) {   // Only retry if we're still in monitor mode
        StatusBar.set('connecting', 'Reconnecting feed…');
        clearTimeout(Monitor.retryTimer);
        Monitor.retryTimer = setTimeout(() => {
          if (Monitor.ws !== null) Monitor._connect();
        }, RECONNECT_MS);
      }
    };
  },

  _render(data) {
    // Update summary stats
    document.getElementById('stat-total').textContent   = data.total_objects   ?? 0;
    document.getElementById('stat-new').textContent     = data.new_objects     ?? 0;
    document.getElementById('stat-removed').textContent = data.removed_objects ?? 0;
    document.getElementById('last-update').textContent  = 'Updated at ' + (data.timestamp ?? '–');

    // Stability bar
    const stab = Math.min(100, Math.max(0, data.scene_stability ?? 0));
    document.getElementById('stability-fill').style.width = stab + '%';
    document.getElementById('stability-pct').textContent  = stab.toFixed(0) + '%';

    // Object cards
    const list = document.getElementById('objects-list');
    const objects = data.objects ?? [];

    if (objects.length === 0) {
      list.innerHTML = `
        <div id="empty-state">
          <span class="icon">🔍</span>
          <p>No objects detected yet.<br>Point the camera at something!</p>
        </div>`;
      return;
    }

    list.innerHTML = objects.map(obj => {
      const emoji    = CATEGORY_EMOJI[obj.category] ?? '📦';
      const confPct  = Math.round((obj.confidence ?? 0) * 100);
      const dur      = _formatDuration(obj.duration_seconds ?? 0);
      const isNew    = obj.is_new;
      const newBadge = isNew ? '<span class="obj-new-badge">NEW</span>' : '';

      return `
        <div class="obj-card ${isNew ? 'is-new' : ''}">
          <div class="obj-card-top">
            <span class="obj-emoji">${emoji}</span>
            <div>
              <div class="obj-label">${_esc(obj.label)}${newBadge}</div>
              <div class="obj-category">${_esc(obj.category)}</div>
            </div>
            <span class="obj-track">#${obj.track_id ?? '?'}</span>
          </div>
          <div class="obj-meta">
            <div class="obj-stat">
              <div class="obj-stat-label">Confidence</div>
              <div class="conf-bar">
                <div class="conf-fill" style="width:${confPct}%"></div>
              </div>
              <div class="conf-val">${confPct}%</div>
            </div>
            <div class="obj-stat">
              <div class="obj-stat-label">In Scene</div>
              <div class="dur-val">${dur}</div>
            </div>
          </div>
        </div>`;
    }).join('');
  },

  stop() {
    clearTimeout(this.retryTimer);
    // Signal that we intentionally closed (prevents auto-reconnect)
    const ws = this.ws;
    this.ws = null;
    if (ws) { try { ws.close(); } catch(_){} }
  }
};

// ── Utility helpers ─────────────────────────────────────────────────────────
function _formatDuration(sec) {
  if (sec < 60) return Math.round(sec) + 's';
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  return m + 'm ' + s + 's';
}

function _esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── App controller ──────────────────────────────────────────────────────────
const App = {
  mode: 'home',

  enterCapture() {
    this.mode = 'capture';
    Screens.show('capture');
    Capture.start();
  },

  enterMonitor() {
    this.mode = 'monitor';
    Screens.show('monitor');
    Monitor.start();
  },

  exitToHome() {
    if (this.mode === 'capture') Capture.stop();
    if (this.mode === 'monitor') Monitor.stop();
    this.mode = 'home';
    StatusBar.set('', 'Not connected');
    Screens.show('home');
  }
};

// ── PWA Service Worker Registration ────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js')
    .then(() => console.log('[PWA] Service worker registered'))
    .catch(e => console.warn('[PWA] SW registration failed:', e));
}
</script>
