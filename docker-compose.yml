services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data          # Redis persistence (already correct)
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: drpinfotech/camera-intelligence:develop
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      YOLO_CONFIG_DIR: /app/.ultralytics
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      USERNAME_EMAIL: ${USERNAME_EMAIL:-}
      PASSWORD_EMAIL: ${PASSWORD_EMAIL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    volumes:
      # 📂 Persistent Runtime Storage ───────────────────────────────────────
      - app_storage:/app/storage              # All alert clips, uploads, previews

      # 🧠 Face Recognition Data (critical — DO NOT remove) ───────────────
      - face_data:/app/face_recognition/data  # Enrolled face embeddings

      # ⚡ Hot Reload (DEVELOPMENT ONLY — remove for production) ─────────
      # Mounts your local code INTO the container so changes apply instantly
      # without rebuilding the image. Comment this out for production.
      - ./pipelines:/app/pipelines
      - ./core:/app/core
      - ./static:/app/static
      - ./main.py:/app/main.py
      - ./face_recognition:/app/face_recognition
      - ./best.pt:/app/best.pt
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  app_storage:
  face_data:          # 🛠 NEW: persist trained face embeddings
