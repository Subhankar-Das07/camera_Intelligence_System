services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: drpinfotech/camera-intelligence:develop
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      YOLO_CONFIG_DIR: /app/.ultralytics
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_DEFAULT_TO: ${WHATSAPP_DEFAULT_TO:-}
    volumes:
      - app_storage:/app/storage
      - face_data:/app/face_recognition/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/site-admin/status')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    mem_limit: 8g

volumes:
  redis_data:
  app_storage:
  face_data:
